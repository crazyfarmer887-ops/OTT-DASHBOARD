# Included inside the existing HTTPS email-verify.one server only.
location ^~ /netflix/ {
    # The URL itself is a private buyer capability; do not record it in logs.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:6931;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /api/netflix-portal/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:6931;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 110s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
}
