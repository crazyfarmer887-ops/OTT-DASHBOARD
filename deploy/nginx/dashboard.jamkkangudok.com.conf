# Apply after DNS dashboard A -> 43.155.153.165 and certbot issuance.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.jamkkangudok.com;
    location /.well-known/acme-challenge/ { root /var/www/dashboard-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.jamkkangudok.com;
    ssl_certificate /etc/letsencrypt/live/dashboard.jamkkangudok.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.jamkkangudok.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:6931;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
