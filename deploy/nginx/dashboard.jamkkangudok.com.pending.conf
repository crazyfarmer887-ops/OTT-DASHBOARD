# Temporary bootstrap: serve only ACME challenges until DNS/TLS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.jamkkangudok.com;
    location /.well-known/acme-challenge/ { root /var/www/dashboard-acme; }
    location / {
        default_type text/plain;
        return 503 'Dashboard HTTPS activation is pending DNS configuration.';
    }
}
